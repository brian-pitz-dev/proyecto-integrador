name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # El build solo necesita que las variables existan; no se conecta a nada.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder

  # Tests e2e (specs/008-tests-e2e) contra el Supabase real, con la cuenta de prueba E2E.
  # Necesitan los secrets del repo; sin ellos (ej. un PR desde un fork) el job se saltea.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # los tests no pasan por Turnstile (inician sesión directo); el widget solo necesita una clave
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: ¿Hay secrets?
        id: secrets
        run: echo "ok=${{ env.E2E_EMAIL != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.ok == 'true'
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
