version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Un solo PR por mes con las actualizaciones menores, en vez de uno por paquete.
    groups:
      menores:
        update-types: [minor, patch]
    # Versiones mayores (Next 17, TypeScript 7...) se actualizan a mano, leyendo su guía de migración.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
